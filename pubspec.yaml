name: detalhes
description: "Background location tracking app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^10.1.0
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.0.0
  sqflite: ^2.3.0
  path: ^1.8.3
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  osrm: ^0.0.8
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
